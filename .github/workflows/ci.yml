name: Engineering checks
on:
  push:
    branches: [main, feat/initial-platform]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Quality and production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, verified 2026-10-28
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24.11.0"
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14.0"
      - run: npm ci
      - run: npm run scan
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: python -m unittest discover -s scripts -p test_audit.py -v
      - run: npm run build
  browser:
    name: Browser flows and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24.11.0"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  research:
    name: Local research protocols and security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KAMOJANG_RESEARCH: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24.11.0"
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.14.0"
          cache: pip
          cache-dependency-path: scripts/requirements-research.txt
      - run: npm ci
      - run: python -m pip install -r scripts/requirements-research.txt
      - run: python -m unittest discover -s scripts -p test_research.py -v
      - run: python -m unittest discover -s scripts -p test_isolation.py -v
      - run: python -m unittest discover -s scripts -p test_model_audit.py -v
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/forecast.spec.ts tests/isolation.spec.ts --workers=1
